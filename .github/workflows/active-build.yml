name: active-build

# Active Assets Historical Dataset: all live OKX SPOT USDT pairs, current listing only, 1m -> 1H (rule B).
# 8 shards in parallel; raw files of each shard published as a separate release asset (+ sha256); merge + checks.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["requests/active_build.txt"]

permissions:
  contents: write

concurrency:
  group: okx-collect
  cancel-in-progress: false

env:
  TAG: active-raw-${{ github.run_id }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$TAG" out/active_dataset/plan/plan.csv --title "Active dataset raw OKX files (run ${{ github.run_id }})" --notes "Raw OKX 1m-candle monthly files, one tar per shard; per-file url/time/sha256 in download_manifest.csv; tar sha256 in raw_shard*.sha256."

  shard:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        i: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Guard tests on this runner
        run: python3 -I tests/test_proxy.py
      - name: Download + build shard
        run: python3 -I lab/active_build.py shard out/active_dataset/plan/plan.csv ${{ matrix.i }} 8 work/shard${{ matrix.i }}
      - name: Publish raw of this shard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tar -C work/shard${{ matrix.i }} -cf raw_shard${{ matrix.i }}.tar raw
          sha256sum raw_shard${{ matrix.i }}.tar > raw_shard${{ matrix.i }}.sha256
          cp raw_shard${{ matrix.i }}.sha256 work/shard${{ matrix.i }}/
          gh release upload "$TAG" raw_shard${{ matrix.i }}.tar raw_shard${{ matrix.i }}.sha256
          rm -rf work/shard${{ matrix.i }}/raw
      - uses: actions/upload-artifact@v4
        with:
          name: shard${{ matrix.i }}
          path: work/shard${{ matrix.i }}
          retention-days: 30

  merge:
    needs: shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          path: work
      - name: Merge + checks
        run: |
          d=out/active_dataset/run_${{ github.run_id }}
          python3 -I lab/active_build.py merge $d work/shard*
          cat work/shard*/raw_shard*.sha256 > $d/raw_release_sha256.txt
          echo "$TAG" > $d/RELEASE_TAG.txt
      - name: Publish hourly (release) and commit reports
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          d=out/active_dataset/run_${{ github.run_id }}
          tar -C $d -cf hourly_${{ github.run_id }}.tar hourly
          sha256sum hourly_${{ github.run_id }}.tar >> $d/raw_release_sha256.txt
          gh release upload "$TAG" hourly_${{ github.run_id }}.tar $d/download_manifest.csv $d/pair_quality.csv
          rm -rf $d/hourly
          git config user.name "quantlab-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- reports 2>/dev/null || true
          git add out
          git commit -m "active dataset build ${{ github.run_id }}" || echo "nothing to commit"
          git pull --rebase origin main
          git push
