name: jan2024-checks

# old7: listing-only check of 7 pre-2024 announcements; jan8: Jan-2024 addendum to the delisted dataset (8 pairs).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["requests/jan2024_checks.txt"]

permissions:
  contents: write

concurrency:
  group: okx-collect
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Guard tests on this runner
        run: python3 -I tests/test_proxy.py
      - name: old7 + jan8
        run: python3 -I lab/jan2024_checks.py
      - name: Dataset checks (addendum)
        run: |
          d=$(ls -d out/delisted_dataset/*_jan2024_addendum | tail -1)
          python3 -I lab/dataset_checks.py $d > $d/dataset_checks.json; cat $d/dataset_checks.json
      - name: Publish addendum raw files as a release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          d=$(ls -d out/delisted_dataset/*_jan2024_addendum | tail -1); run=$(basename $d)
          tar -C $d -cf raw_$run.tar raw
          sha256sum raw_$run.tar > $d/raw_release_sha256.txt
          gh release create "delisted-raw-$run" raw_$run.tar $d/download_manifest.csv \
            --title "Delisted dataset Jan-2024 addendum raw OKX files $run" \
            --notes "Raw OKX 1m-candle files for the 8 Jan-2024 delisted USDT pairs. Per-file sha256 in download_manifest.csv."
      - name: Commit results (no raw)
        if: always()
        run: |
          git config user.name "quantlab-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- reports 2>/dev/null || true
          git add out
          git commit -m "jan2024 checks $(date -u +%FT%TZ)" || echo "nothing to commit"
          git pull --rebase origin main
          git push
