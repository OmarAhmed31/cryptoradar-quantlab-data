name: okx-probe

# Probe only: 3 coins + raw delisting pages. No secrets are used or needed.
# Runs when requests/probe.txt changes, or manually from the Actions tab.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["requests/probe.txt"]

permissions:
  contents: write   # only to commit the probe results back into out/

concurrency:
  group: okx-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Runner network info (region evidence)
        run: |
          mkdir -p out
          echo "runner_os=$RUNNER_OS arch=$RUNNER_ARCH at=$(date -u +%FT%TZ)" | tee out/runner_info.txt
      - name: Guard proxy tests on this runner
        run: python3 -I tests/test_proxy.py
        continue-on-error: true
      - name: Region check - which delisting archive does each locale path serve? (1 page, no articles)
        run: |
          for L in ar zh-hans en-eu; do
            python3 -I lab/delist_fetch.py 1 0 "https://www.okx.com/$L/help/section/announcements-delistings" | tail -3
            sleep 2
          done
        continue-on-error: true
      - name: Commit results
        run: |
          git config user.name "quantlab-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- reports 2>/dev/null || true
          git add out
          git commit -m "probe results $(date -u +%FT%TZ)" || echo "nothing to commit"
          git push
