name: archive-probe

# LIMITED probe of OKX trade-history archive (static.okx.com) - expert-approved scope only.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["requests/archive_probe.txt"]

permissions:
  contents: write

concurrency:
  group: okx-collect
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Guard tests on this runner
        run: python3 -I tests/test_proxy.py
      - name: Archive probe
        run: python3 -I lab/archive_probe.py
      - name: Commit results
        if: always()
        run: |
          git config user.name "quantlab-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add out
          git commit -m "archive probe $(date -u +%FT%TZ)" || echo "nothing to commit"
          git pull --rebase origin main
          git push
