name: tag-protocol

# Creates an annotated tag for an approved protocol commit.
# requests/tag_protocol.txt: "<tag> <commit_sha> <protocol_path> <expected_sha256> <message...>"
on:
  push:
    branches: [main]
    paths: ["requests/tag_protocol.txt"]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify protocol hash, then tag
        run: |
          read tag sha path want msg < requests/tag_protocol.txt
          got=$(git show $sha:$path | sha256sum | cut -c1-64)
          test "$got" = "$want" || { echo "hash mismatch $got != $want"; exit 1; }
          git config user.name "quantlab-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" "$sha" -m "$msg"
          git push origin "refs/tags/$tag"
